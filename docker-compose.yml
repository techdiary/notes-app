version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: testdb-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres      # ← Must be here
      POSTGRES_PASSWORD: 123       # ← Must be here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: